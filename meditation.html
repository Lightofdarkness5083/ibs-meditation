<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>묵상하기 - Q&A IBS 묵상</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">Q&A IBS</a>
    <div class="nav-links">
      <a href="index.html">홈</a>
      <a href="overview.html">성경책 개관</a>
      <a href="meditation.html" class="active">묵상하기</a>
    </div>
  </nav>

  <main class="meditation-page">

    <!-- 시작 화면: 묵상할 본문 선택 -->
    <section id="setup-section">
      <h1>묵상할 본문을 선택하세요</h1>

      <div id="setup-form">
        <select id="book-select">
          <option value="">-- 성경책을 선택하세요 --</option>
          <option value="창세기">창세기</option>
          <option value="시편">시편</option>
          <option value="이사야">이사야</option>
          <option value="요한복음">요한복음</option>
          <option value="골로새서">골로새서</option>
        </select>
        <input type="text" id="chapter-verse-input" placeholder="예: 1:15-20">
        <button id="start-btn">묵상 시작하기</button>
      </div>

      <p id="setup-status"></p>
    </section>

    <!-- 묵상 진행 화면: 7단계 -->
    <section id="stage-section" style="display:none;">
      <p id="stage-label"></p>
      <h1 id="stage-title"></h1>

      <!-- 본문 패널: 소리내어읽기~적용 단계까지 계속 표시 -->
      <div id="verse-panel" style="display:none;">
        <div id="verse-panel-header">
          <span id="verse-panel-title"></span>
          <button id="verse-toggle-btn" type="button">접기</button>
        </div>
        <div id="verse-panel-body"></div>
      </div>

      <div id="qa-box">
        <p id="stage-loading" style="display:none;">준비하는 중입니다...</p>
        <div id="stage-content" style="display:none;"></div>
        <button id="retry-btn" style="display:none;">다시 시도</button>

        <textarea id="stage-answer" rows="3"></textarea>
      </div>

      <div>
        <button id="next-btn">다음</button>
      </div>
    </section>

    <!-- 완료 화면 -->
    <section id="done-section" style="display:none;">
      <h1>묵상을 완료했습니다</h1>
      <p>오늘도 말씀 앞에 서주셔서 감사합니다.</p>

      <div id="summary-list"></div>

      <button id="restart-btn">새로운 본문으로 다시 시작하기</button>
    </section>

  </main>

  <script src="js/meditation.js"></script>
</body>
</html>
