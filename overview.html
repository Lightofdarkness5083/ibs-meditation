<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>성경책 개관 - Q&A IBS 묵상</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">Q&A IBS</a>
    <div class="nav-links">
      <a href="index.html">홈</a>
      <a href="overview.html" class="active">성경책 개관</a>
      <a href="meditation.html">묵상하기</a>
    </div>
  </nav>

  <main class="overview-page">
    <h1>성경책 개관</h1>
    <p class="page-desc">책을 선택하면 AI가 BRI, key verse, 책의 구조를 정리해드립니다.</p>

    <div class="overview-form">
      <select id="book-select">
        <option value="">-- 성경책을 선택하세요 --</option>
        <option value="창세기">창세기</option>
        <option value="시편">시편</option>
        <option value="이사야">이사야</option>
        <option value="요한복음">요한복음</option>
        <option value="골로새서">골로새서</option>
      </select>
      <button id="overview-btn">개관 생성하기</button>
    </div>

    <div id="overview-status"></div>

    <div id="overview-result" class="overview-result" style="display:none;">
      <section class="result-card">
        <h2>BRI (핵심 정보)</h2>
        <p id="result-bri"></p>
      </section>

      <section class="result-card">
        <h2>Key Verse</h2>
        <p id="result-key-verse"></p>
      </section>

      <section class="result-card">
        <h2>책의 구조</h2>
        <ul id="result-structure"></ul>
      </section>
    </div>
  </main>

  <script src="js/overview.js"></script>
</body>
</html>
